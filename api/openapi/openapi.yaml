  /api/v1/analysis/calculate:
    post:
      tags:
      - 数据分析
      operationId: calculateScientificAnalysis
      summary: calculateScientificAnalysis
      description: 真实来源按当前用户权限加载；最多20组/20000测点；十进制字符串，50位ROUND_HALF_EVEN；不插值、不推断关联或机理。仅计算，不写科学数据。
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功；统一包络
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/AnalysisResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisCalculate'
  /api/v1/analysis/save:
    post:
      tags:
      - 数据分析
      operationId: saveScientificAnalysis
      summary: saveScientificAnalysis
      description: 真实来源按当前用户权限加载；最多20组/20000测点；十进制字符串，50位ROUND_HALF_EVEN；不插值、不推断关联或机理。admin/operator显式保存派生快照；仅1组正式测量或明确2组配对，必须expected_row_version；记录recipe/摘要/哈希，不修改测量和原件。
      x-implementation-status: implemented
      responses:
        '201':
          description: 成功；统一包络
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/AnalysisSaveResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisSave'
  /api/v1/analysis/saved/{result_id}:
    get:
      tags:
      - 数据分析
