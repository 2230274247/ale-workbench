components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '在请求头中携带：`Authorization: Bearer <access_token>`。

        access_token 有效期 1 小时，过期后用 `/auth/refresh` 换取新令牌。

        '
  responses:
    Success:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    Unauthorized:
      description: 未认证或令牌无效/过期
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    Forbidden:
      description: 已认证但权限不足
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    Conflict:
      description: 资源冲突（如唯一键重复）
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    UnprocessableEntity:
      description: 业务规则校验失败
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    TooManyRequests:
      description: 请求过于频繁（触发限流）
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    InternalError:
      description: 服务端内部错误
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/ErrorDetail'
    ServiceUnavailable:
      description: 数据库不可用或迁移未就绪
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ApiEnvelope'
