x-prepared-readonly-analysis:
  name: scientific_analysis
  readonly: true
  external_raw_data: false
  function: app.scientificanalysis.calculate
  request_schema:
    $defs:
      Selection:
        additionalProperties: false
        properties:
          include_outliers:
            default: true
            title: Include Outliers
            type: boolean
          excluded_points:
            items:
              maxLength: 80
              minLength: 1
              type: string
            maxItems: 1000
            title: Excluded Points
            type: array
          reason:
            default: ''
            maxLength: 4000
            title: Reason
            type: string
        title: Selection
        type: object
      Source:
        additionalProperties: false
        properties:
          kind:
            enum:
            - measurement
            - import_item
            title: Kind
            type: string
          id:
            exclusiveMinimum: 0
            title: Id
            type: integer
          block_index:
            default: 0
            maximum: 15
            minimum: 0
            title: Block Index
            type: integer
          sample_id:
            anyOf:
            - exclusiveMinimum: 0
              type: integer
            - type: 'null'
            default: null
            title: Sample Id
          stage:
            anyOf:
            - enum:
              - initial
              - after_o2_plasma
              - after_o3_pre
              - after_ale
              - after_hf_only
              - after_o3_only
              - intermediate
              - final
              - other
              type: string
            - type: 'null'
            default: null
            title: Stage
          stage_seq:
            anyOf:
            - maximum: 4294967295
              minimum: 0
              type: integer
            - type: 'null'
            default: null
            title: Stage Seq
          optical_model_id:
            anyOf:
            - exclusiveMinimum: 0
              type: integer
            - type: 'null'
            default: null
            title: Optical Model Id
          confirm_associations:
