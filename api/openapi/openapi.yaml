openapi: 3.1.0
info:
  title: ALE 实验工作台 API
  version: 1.8.0
  summary: 第八轮：记录生命周期、实验向导与首页聚合
  description: '账户隔离同步：用途management/research/testing、配置环境、可选admin_global_scope；AI用户月额度/策略及policy、usage/me和admin分账。


    当前1.8.0：0011/0012增量生命周期元数据；生命周期影响预览/应用、实验向导和三个首页聚合，共8个新增实际操作。四类记录include_voided，样品另有include_archived；作废与归档不改写科学观测。


    当前1.7.0：0010通用step_kind、process_flow与两个grid PUT；5个科学分析操作（既有pair转implemented）。准备态只读分析元数据未接入live AI工具。AI models为实际供应商发现/账本操作，不是分析工具注册。Windows实际重启和真实DeepSeek连通未在本次验证。


    当前1.6.0：在第五轮契约基础新增样品作废及十一个AI操作（含请求列表/详情、恢复、对账）；既有operationId与planned范围保留。AI科学工具只读，但配置、预算预留、请求、会话与调用追踪会持久化。对话ID仅本人可复用（含admin不能访问他人会话）；每轮使用当前问题、当前上下文和新查询结果；仅参考最近两轮成功请求的用户意图并在当前权限下重执行最多四个去重工具计划，旧模型答案不外发。


    历史1.5.0实现说明：当时保留原142操作及operationId，新增导入任务删除、样品与关联选项、步骤参数模板CRUD五操作、批次与执行归档，共152操作。原GET /tools从planned转implemented。


    通用步骤parameter_snapshot严格复用backend/app/step_templates.py的ParameterSnapshot：step_type、temperature(value/unit)、groups(name/fields[name/value/unit])；值为字符串或null，不由旧参数或模板自动推断。批次/执行archived_at独立可空，归档必须携带expected_row_version。


    新增通用化学体系（体系/物种/可复用步骤模板）、批次内批量创建样品、运行批量绑定样品、计划归档与自定义步骤参数（step_name/custom_parameters）；plan status 扩展 archived。

    导入 multipart files[] 预览与逐项原子确认；测量质量 PATCH 与显式 supersede；source/dataset 只读。verify、source POST/PATCH、手工 measurement POST、点写入、光学模型等仍
    planned。

    导入任务仅本人（含admin）；资源按真实样品/操作人/occurrence范围授权。admin/operator 可导入和更新质量/取代，viewer只读。原件按SHA不可变保存；下载成功为binary，其他业务JSON统一包络。

    operator/viewer 的计划按 owner_user_id、运行按 operator_user_id 过滤，并验证所有关联批次/计划/样品可见。admin/operator 可写 Phase 2；viewer 只读。批次/样品删除仍仅
    admin；有科学依赖返回 409，不级联或置空关联。

    计划与运行有 row_version，子项修改递增父版本；PATCH/DELETE 的 expected_row_version 可选，流转创建则必填样品版本。step_id 表示实际步骤完成之后；历史按 transition_id 追加顺序查询。绑定不改变样品状态，load/unload
    控制占用。

    DECIMAL 仅接受普通十进制字符串；未知观测保持 null，计划/配方不自动填充实际观测。请求与响应独立，请求禁止额外字段与服务端 ID。

    access JWT 1 小时，refresh JWT 7 天；数据库会话可撤销，刷新轮换 refresh。刷新可选 JSON refresh_token，省略使用 HttpOnly、SameSite=Strict cookie，HTTPS
    下 Secure。

    统一包络 code/message/data/request_id/timestamp；204 无 body；分页 data 数组与同级 meta。'
  contact:
    name: ALE 实验工作台项目组
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: http://127.0.0.1:8000
  description: 本地开发环境
- url: https://ale-workbench.local
  description: 课题组内部部署
tags:
- name: 认证
  description: 注册、登录、令牌管理、当前用户信息
- name: 用户管理
  description: 用户 CRUD 与审计日志（仅管理员）
- name: 首页
  description: 概况统计、最新数据、近期计划、数据质量提示
- name: 批次
  description: 沉积批次管理。批次是数据可比性的强制隔离边界
- name: 样品
  description: 样品管理、母片-小样层级、证据汇总
- name: 样品流转
  description: 样品状态变更时间线
- name: 实验计划
  description: 实验计划（执行之前）
- name: 实验执行
  description: 工艺运行、工艺步骤、运行-样品关联
- name: 光学模型
  description: 椭偏 n/k 模型管理
- name: 测量
  description: 测量记录与点级数据、重测取代链
- name: 数据分析
  description: 派生结果、点级配对计算
- name: 原始文件
  description: 原始文件登记与 SHA-256 溯源
- name: 图表中心
  description: 图表模板、数据接口、导出
- name: 结论台账
  description: 研究结论（区分实测观察与机理假设）
- name: 问题台账
  description: 问题记录与禁止误用条款
- name: 仪器数据
  description: XPS / RGA / 未来仪器数据的通用三层模型
- name: 附件
  description: 图、Origin 工程、报告等产出登记
- name: 设备与配方
  description: 仪器设备台账与工艺配方（标称定义）
- name: 导入
  description: 不可变原件、解析预览、手动关联及显式确认
- name: 化学体系
  description: 通用化学体系、物种与可复用步骤模板
- name: 步骤参数模板
  description: 通用分组参数模板及快照，独立于化学体系步骤模板
- name: AI助手
  description: 可选只读科研助手；配置与用量仅admin，status/chat所有登录角色
- name: 生命周期
- name: 实验向导
security:
- BearerAuth: []
