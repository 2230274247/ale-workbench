  - sample
  - processes
  - baseline_measurements
  properties:
    sample:
      $ref: '#/Sample'
    processes:
      type: array
      items:
        $ref: '#/ImportProcessOption'
    baseline_measurements:
      type: array
      items:
        $ref: '#/ImportBaselineOption'
