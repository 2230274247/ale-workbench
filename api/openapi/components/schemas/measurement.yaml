MeasurementStage:
  type: string
  enum:
  - initial
  - after_o2_plasma
  - after_o3_pre
  - after_ale
  - after_hf_only
  - after_o3_only
  - intermediate
  - final
  - other
  description: '测量阶段。区分测量处于工艺链的哪个位置。


    本字段使「中间测厚的缺失」成为可查询事实——

    EXP-07 与 ISS-07 都强调：没有 O3 阶段结束时的中间测厚，

    就不能把净差值全部归于 HF-TMA。

    '
  examples:
  - initial
MeasurementQualityFlag:
  type: string
  enum:
  - ok
  - suspect
  - abnormal
  - excluded
  description: '测量质量标记。

    - `suspect`  拟合质量可疑（如 B05-S08 处理前某点 MSE=20.58）

    - `abnormal` 异常

    - `excluded` 已排除

    **注意：标记不等于删除，异常值保留并优先复核（ISS-08）。**

    '
