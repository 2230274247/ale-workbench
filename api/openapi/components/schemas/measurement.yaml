SupersedeRequest:
  type: object
  description: '将某次测量标记为被取代。

    取代后：原测量 is_current=false，新测量 is_current=true，

    且新测量 supersedes_measurement_id 指向原测量。

    依赖原测量的派生结果将被标记为需重算。

    '
  required:
  - superseded_measurement_id
  - reason
  properties:
    superseded_measurement_id:
      type: integer
      format: int64
      description: 被取代的测量 ID
    reason:
      type: string
      minLength: 4
      description: 取代原因（必填，写入 supersede_reason）
      examples:
      - 二次测量，原始光谱拟合质量偏低
