ResultKind:
  type: string
  enum:
  - apparent_removal_R
  - delta_d
  - apparent_epc
  - rate
  - paired_point_delta
  - uniformity
  - fit_quality
  - other
  description: '派生结果类型。

    - `apparent_removal_R` 表观减薄 R = before - after

    - `delta_d`            表观增厚 Δd = after - before

    - `apparent_epc`       表观每循环减薄量（**非已证实稳态 ALE 速率**）

    - `rate`               速率

    - `paired_point_delta` 点级配对差

    - `uniformity`         均匀性

    - `fit_quality`        拟合质量

    '
  examples:
  - apparent_removal_R
PairingMethod:
  type: string
  enum:
  - same_xy_coordinate
  - row_index
  - mean_difference
  description: '配对方法。

    `same_xy_coordinate` 为推荐做法（按数值 X、Y 精确一一连接）；

    `row_index` 按 Excel 行号相减，**会引入错误**，仅用于兼容历史数据。

    '
  examples:
  - same_xy_coordinate
DerivedResult:
  type: object
  description: '派生分析结果。


    **所有结论必须是派生对象，禁止手填。**

    减薄量 R 由两次具体测量计算得出，任何结论都能回溯到源测量。

    '
  required:
  - result_id
  - result_code
  - result_kind
  - sample_id
  - is_valid
  - evidence_level
  properties:
    result_id:
      type: integer
      format: int64
    result_code:
      type: string
      maxLength: 128
      examples:
      - RES-B05-S01-R
    result_kind:
      $ref: '#/ResultKind'
    sample_id:
      type: integer
      format: int64
    sample_code:
      type:
      - string
      - 'null'
    before_measurement_id:
      type:
      - integer
      - 'null'
      format: int64
    after_measurement_id:
      type:
      - integer
      - 'null'
      format: int64
    process_id:
      type:
      - integer
      - 'null'
      format: int64
    value_nm:
      type:
      - string
      - 'null'
      x-db-type: decimal(16,8)
      description: 数值（单位见 value_unit）
      examples:
      - '2.34000000'
    value_unit:
      type:
      - string
      - 'null'
      enum:
      - nm
      - A_per_cycle
      - pct
      - null
    value_sd_nm:
      type:
      - string
      - 'null'
      x-db-type: decimal(16,8)
      description: 空间 SD（**非独立重复误差**）
    cycles_basis:
      type:
      - integer
      - 'null'
      description: 计算速率所用循环基数
    pairing_method:
      $ref: '#/PairingMethod'
    paired_point_count:
      type:
      - integer
      - 'null'
    model_consistent:
      type:
      - boolean
      - 'null'
      description: '前后测量是否使用同一光学模型。

        `false` 表示该结果是**跨模型相减**，需谨慎解释。

        `null` 表示无法判定（未记录模型）。

        '
      examples:
      - false
    model_warning:
      type:
      - string
      - 'null'
      readOnly: true
      description: 由服务端根据 model_consistent 自动生成的警告文字
      examples:
      - ⚠ 前后测量使用了不同光学模型，该差值为跨模型相减
    is_valid:
      type: boolean
      description: '结果是否有效。

        当源测量被取代时置 false，提示需重算。

        '
    evidence_level:
      $ref: '#/EvidenceLevel'
    computation_note:
      type:
      - string
      - 'null'
      description: 计算说明与限制
    computed_at:
      type:
      - string
      - 'null'
      format: date-time
    computed_by:
      type:
      - string
      - 'null'
      examples:
      - import_script_v1
    created_at:
      type: string
      format: date-time
