      type: string
      x-db-column: false
    id:
      anyOf:
      - maximum: 9223372036854775807
        minimum: 1
        type: integer
        x-python-strict: true
      - type: 'null'
      default: null
      title: Id
      x-db-column: false
  required:
  - kind
  title: Context
  type: object
  x-python-methods:
  - '    @model_validator(mode=''after'')'
  - '    def valid(self):'
  - '        if (self.kind == ''none'') != (self.id is None): raise ValueError(''Context requires record ID'')'
  - '        return self'
