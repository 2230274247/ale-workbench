    planned_end:
      type:
      - string
      - 'null'
      format: date
    priority:
      $ref: '#/PlanPriority'
    status:
      $ref: '#/PlanStatus'
    owner:
      $ref: '#/UserBrief'
DataQualityAlert:
  type: object
  description: '数据质量提示。服务端主动识别的问题，例如：

    跨模型相减的结果、高 MSE 测点、被取代的基线、

    悬空的样品映射。用于首页提醒。

    '
  required:
  - alert_type
  - severity
  - message
  properties:
    alert_type:
      type: string
      enum:
      - cross_model_comparison
      - high_mse_measurement
      - superseded_baseline
      - unresolved_instrument_mapping
      - excluded_sample_used
      - missing_intermediate_measurement
      - model_inconsistent_derived
    severity:
      type: string
      enum:
      - high
      - medium
      - low
    message:
      type: string
      description: 面向用户的说明（中文）
    entity_type:
      $ref: '#/EntityType'
    entity_id:
      type:
      - integer
      - 'null'
      format: int64
    entity_code:
      type:
      - string
      - 'null'
      description: 实体编码，便于前端跳转
      examples:
      - RES-W01-S01-R100
