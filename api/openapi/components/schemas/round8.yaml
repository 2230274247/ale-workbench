LifecycleProcess:
  type: object
  description: 工艺运行（一次实际执行事件）。
  required:
  - process_id
  - process_code
  - plan_id
  - batch_id
  - process_mode
  - tool_id
  - chemistry_system_id
  - r1_temp_c
  - r2_temp_c
  - n2_flow_sccm
  - o3_pre_cycles
  - o3_pre_duration_s
  - full_ale_cycles
  - hf_tma_repeats
  - started_at
  - ended_at
  - operator_user_id
  - co_etch_group
  - is_independent_run
  - log_status
  - notes
  - created_at
  - updated_at
  - row_version
  - archived_at
  - process_flow
  - voided_at
  - void_reason
  - voided_by_user_id
  properties:
    process_id:
      type: integer
      format: int64
      readOnly: true
      x-db-column: false
    process_code:
      type: string
      maxLength: 64
      examples:
      - RUN-20261014-B05-PRE-HFTMA5
      x-db-column: false
    plan_id:
      type:
      - integer
      - 'null'
      format: int64
      description: 所属实验计划（可为空，表示临时加做）
      x-db-column: false
    batch_id:
      type:
      - integer
      - 'null'
      format: int64
      x-db-column: false
    process_mode:
      $ref: '#/components/schemas/ProcessMode'
      x-db-column: false
    tool_id:
      type:
      - integer
      - 'null'
      format: int64
      x-db-column: false
    chemistry_system_id:
      type:
      - integer
      - 'null'
      format: int64
      description: 关联的通用化学体系（可为空）；删除被引用的体系返回 409。
      x-db-column: false
    r1_temp_c:
      type:
      - string
      - 'null'
      x-db-type: decimal(8,2)
      description: R1 实测温度（℃）。与配方标称值分开。
      x-db-column: false
    r2_temp_c:
      type:
      - string
      - 'null'
      x-db-type: decimal(8,2)
      x-db-column: false
    n2_flow_sccm:
      type:
      - string
      - 'null'
      x-db-type: decimal(10,3)
      x-db-column: false
    o3_pre_cycles:
      type:
      - integer
      - 'null'
      description: 'O3 预暴露**次数**。

        ISS-07: 次数不等于已标定的分子剂量，且不可与秒数混淆

        （源文件名中的 "10s" 实为 10 次）。

        '
      examples:
      - 50
      x-db-column: false
    o3_pre_duration_s:
      type:
      - string
      - 'null'
      x-db-type: decimal(10,3)
      description: 单次预暴露时长（秒）。与次数分开记录。
      x-db-column: false
    full_ale_cycles:
      type:
      - integer
      - 'null'
      examples:
      - 50
      x-db-column: false
    hf_tma_repeats:
      type:
      - integer
      - 'null'
      examples:
      - 5
      x-db-column: false
    started_at:
      type:
      - string
      - 'null'
      format: date-time
      x-db-column: false
    ended_at:
      type:
      - string
      - 'null'
      format: date-time
      x-db-column: false
    operator_user_id:
      type:
      - integer
      - 'null'
      format: int64
      x-db-column: false
    co_etch_group:
      type:
      - string
      - 'null'
      maxLength: 64
      description: '共腔分组标识。ISS-06: 共腔处理的样品与独立运行样品

        不构成工艺独立重复，不可平均成单个工艺点。

        '
      examples:
      - COETCH-B28-S04S06
      x-db-column: false
    is_independent_run:
      anyOf:
      - *id001
      - type: integer
        enum:
        - 0
        - 1
      x-db-column: false
    log_status:
      $ref: '#/components/schemas/ProcessLogStatus'
      x-db-column: false
    notes:
      type:
      - string
      - 'null'
      x-db-column: false
    created_at:
      type: string
      format: date-time
      x-db-column: false
    updated_at:
      type: string
      format: date-time
      x-db-column: false
    row_version:
      type: integer
      minimum: 1
      readOnly: true
      description: 服务端并发版本；更新父记录或其子记录时递增。子记录自身没有 row_version。
      x-db-column: false
    archived_at:
      type:
      - string
      - 'null'
      format: date-time
      readOnly: true
      x-db-column: processes.archived_at
      description: 独立归档时间；null 表示未归档，不改原有科学状态。
    process_flow:
      anyOf:
      - $ref: '#/components/schemas/ProcessFlow'
      - type: 'null'
      x-db-column: processes.process_flow
      description: 保存后step_id为真实数据库ID；空值表示旧记录无布局。
    voided_at:
      anyOf:
      - type: string
        format: date-time
      - type: 'null'
      readOnly: true
      x-db-column: processes.voided_at
    void_reason:
      anyOf:
      - type: string
        maxLength: 2000
      - type: 'null'
      readOnly: true
      x-db-column: processes.void_reason
    voided_by_user_id:
      anyOf:
      - type: integer
        exclusiveMinimum: 0
      - type: 'null'
      readOnly: true
      x-db-column: processes.voided_by_user_id
  additionalProperties: false
