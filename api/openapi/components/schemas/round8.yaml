LifecycleBatch:
  type: object
  description: '沉积批次。**批次是数据可比性的强制隔离边界**——

    不同批次初始厚度约 30/300/74/47nm，不应合并拟合。


    阶段 1：admin 全部可见；operator/viewer 仅自己的 owner_user_id；样品所属批次也必须可见，无共享。'
  required:
  - batch_id
  - batch_code
  - batch_name
  - material
  - wafer_size
  - nominal_thickness_nm
  - deposit_recipe_id
  - deposit_date
  - deposit_set_temp_c
  - deposit_actual_temp_c
  - deposit_gas_flows
  - source_zip
  - source_zip_sha256
  - anomaly_flag
  - anomaly_note
  - owner_user_id
  - status
  - notes
  - created_at
  - updated_at
  - row_version
  - archived_at
  - voided_at
  - void_reason
  - voided_by_user_id
  properties:
    batch_id:
      type: integer
      format: int64
      examples:
      - 1
      x-db-column: false
    batch_code:
      type: string
      maxLength: 64
      description: 批次编码，全局唯一
      examples:
      - B-20260831-W01
      x-db-column: false
    batch_name:
      type: string
      maxLength: 255
      examples:
      - 8/31 批次 约30nm W01
      x-db-column: false
    material:
      type: string
      maxLength: 128
      examples:
      - PECVD SiNx:H
      x-db-column: false
    wafer_size:
      type:
      - string
      - 'null'
      maxLength: 32
      examples:
      - 4inchx4inch
      x-db-column: false
    nominal_thickness_nm:
      type:
      - string
      - 'null'
      x-db-type: decimal(12,3)
      description: 标称厚度（nm）。为 string 以避免浮点精度损失。
      examples:
      - '30.000'
      x-db-column: false
    deposit_recipe_id:
      type:
      - integer
      - 'null'
      format: int64
      x-db-column: false
    deposit_date:
      type:
      - string
      - 'null'
      format: date
      x-db-column: false
    deposit_set_temp_c:
      type:
      - string
      - 'null'
      x-db-type: decimal(8,2)
      description: PECVD 设定温度（℃）
      examples:
      - '275.00'
      x-db-column: false
    deposit_actual_temp_c:
      type:
      - string
      - 'null'
      x-db-type: decimal(8,2)
      description: 'PECVD 实测温度（℃）。**必须与设定值分开记录**——

        ISS-02 要求不可据文件名断言温度异常幅度。

        '
      examples:
      - '275.00'
      x-db-column: false
    deposit_gas_flows:
      type:
      - object
      - 'null'
      additionalProperties: true
      description: '沉积气体流量，如 {"SiH4": 20, "NH3": 100, "N2": 200}'
      x-db-column: false
    source_zip:
      type:
      - string
      - 'null'
      maxLength: 255
      examples:
      - 1.-2026.8.31-SiN.zip
      x-db-column: false
    source_zip_sha256:
      type:
      - string
      - 'null'
      pattern: ^[a-f0-9]{64}$
      description: 原始压缩包 SHA-256，用于溯源校验
      examples:
      - 93e9e8593de2ccc83ac75ab7058f313d16b1b84bdd3471c6101310bfb185b99a
      x-db-column: false
    anomaly_flag:
      anyOf:
      - &id001
        type: boolean
        x-db-column: false
      - type: integer
        enum:
        - 0
        - 1
      x-db-column: false
    anomaly_note:
      type:
      - string
      - 'null'
      description: 异常描述。**禁止据文件名断言故障机理**（ISS-02）。
      x-db-column: false
    owner_user_id:
      type:
      - integer
      - 'null'
      format: int64
      x-db-column: false
    status:
      $ref: '#/components/schemas/BatchStatus'
      x-db-column: false
    notes:
      type:
      - string
      - 'null'
      x-db-column: false
    created_at:
      type: string
      format: date-time
      x-db-column: false
    updated_at:
      type: string
      format: date-time
      x-db-column: false
    row_version:
      type: integer
      minimum: 1
      readOnly: true
      description: 服务端并发版本，每次更新递增。
      x-db-column: false
    archived_at:
      type:
      - string
      - 'null'
      format: date-time
      readOnly: true
      x-db-column: batches.archived_at
      description: 独立归档时间；null 表示未归档，不改原有科学状态。
    voided_at:
      anyOf:
      - type: string
        format: date-time
      - type: 'null'
      readOnly: true
      x-db-column: batches.voided_at
    void_reason:
      anyOf:
      - type: string
        maxLength: 2000
      - type: 'null'
      readOnly: true
      x-db-column: batches.void_reason
    voided_by_user_id:
      anyOf:
      - type: integer
        exclusiveMinimum: 0
      - type: 'null'
      readOnly: true
      x-db-column: batches.voided_by_user_id
  additionalProperties: false
LifecycleSample:
  type: object
  description: '样品。**工作台的中心实体**。

    样品编码全局唯一（W01-S01 / B28-S06 / B05-S01 是不同样品，

    不因数字相同而合并）。


    阶段 1：admin 全部可见；operator/viewer 仅自己的 owner_user_id；样品所属批次也必须可见，无共享。'
  required:
  - sample_id
  - sample_code
  - batch_id
  - parent_sample_id
  - sample_type
  - display_label
  - nominal_thickness_nm
  - size_desc
  - cut_position
  - surface_state
  - pre_treatment
  - status
  - exclude_from_analysis
  - exclude_reason
  - owner_user_id
  - notes
  - created_at
  - updated_at
  - row_version
  - voided_at
  - void_reason
  - voided_by_user_id
  - archived_at
  - archived_by_user_id
  properties:
    sample_id:
      type: integer
      format: int64
      x-db-column: false
    sample_code:
      type: string
      maxLength: 64
      description: 全局唯一样品编码
      examples:
      - W01-S09
      x-db-column: false
    batch_id:
      type: integer
      format: int64
      x-db-column: false
    parent_sample_id:
      type:
      - integer
      - 'null'
      format: int64
      description: 母片/上级样品 ID（支持母片-小样层级）
      x-db-column: false
    sample_type:
      $ref: '#/components/schemas/SampleType'
      x-db-column: false
    display_label:
      type:
      - string
      - 'null'
      maxLength: 128
      description: 原始文件中的编号，如 "1" / "9"
      examples:
      - '9'
      x-db-column: false
    nominal_thickness_nm:
      type:
      - string
      - 'null'
      x-db-type: decimal(12,3)
      x-db-column: false
    size_desc:
      type:
      - string
      - 'null'
      maxLength: 64
      examples:
      - 20mmx20mm
      x-db-column: false
    cut_position:
      type:
      - string
      - 'null'
      maxLength: 128
      x-db-column: false
    surface_state:
      type:
      - string
      - 'null'
      maxLength: 128
      x-db-column: false
    pre_treatment:
      type:
      - string
      - 'null'
      maxLength: 255
      description: '前处理描述。ISS-05 要求必须记录前处理——

        W01-S09 因酒精湿巾擦拭导致结果异常。

        '
      examples:
      - 酒精湿巾擦拭后 HF-only
      x-db-column: false
    status:
      $ref: '#/components/schemas/SampleStatus'
      x-db-column: false
    exclude_from_analysis:
      anyOf:
      - *id001
      - type: integer
        enum:
        - 0
        - 1
      x-db-column: false
    exclude_reason:
      type:
      - string
      - 'null'
      description: 排除理由。`exclude_from_analysis=true` 时应填写。
      examples:
      - 'ISS-05: 酒精湿巾擦拭导致刻蚀量异常升高且均匀度破坏'
      x-db-column: false
    owner_user_id:
      type:
      - integer
      - 'null'
      format: int64
      x-db-column: false
    notes:
      type:
      - string
      - 'null'
      x-db-column: false
    created_at:
      type: string
      format: date-time
      x-db-column: false
    updated_at:
      type: string
      format: date-time
      x-db-column: false
    row_version:
      type: integer
      minimum: 1
      readOnly: true
      description: 服务端并发版本，每次更新递增。
      x-db-column: false
    voided_at:
      anyOf:
      - type: string
        format: date-time
      - type: 'null'
      readOnly: true
      x-db-column: samples.voided_at
    void_reason:
      anyOf:
      - type: string
        maxLength: 2000
      - type: 'null'
      readOnly: true
      x-db-column: samples.void_reason
    voided_by_user_id:
      anyOf:
      - type: integer
        exclusiveMinimum: 0
      - type: 'null'
      readOnly: true
      x-db-column: samples.voided_by_user_id
    archived_at:
      anyOf:
      - type: string
        format: date-time
      - type: 'null'
      readOnly: true
      x-db-column: samples.archived_at
    archived_by_user_id:
      anyOf:
      - type: integer
        exclusiveMinimum: 0
      - type: 'null'
      readOnly: true
      x-db-column: samples.archived_by_user_id
  additionalProperties: false
