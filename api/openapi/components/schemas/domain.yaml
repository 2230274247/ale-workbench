  description: 单个自定义参数项；value 为数字时统一按字符串存储与回传。
  properties:
    value:
      anyOf:
      - type: string
      - type: number
      - type: 'null'
      default: null
    unit:
      anyOf:
      - maxLength: 24
        type: string
      - type: 'null'
      default: null
    note:
      anyOf:
      - maxLength: 255
        type: string
      - type: 'null'
      default: null
CustomParameters:
  type: object
  maxProperties: 32
  propertyNames:
    pattern: ^[A-Za-z0-9_]{1,64}$
  additionalProperties:
    $ref: '#/CustomParameter'
  description: 自定义参数映射；最多 32 项，键为 1–64 位字母数字下划线。
BatchItem:
  type: object
  additionalProperties: false
  description: 批量创建样品中的单个样品；批次来自路径，不在请求体中。
  required:
  - sample_code
  properties:
    sample_code:
      type: string
      minLength: 1
      maxLength: 64
    sample_type:
      $ref: '#/SampleType'
    display_label:
      anyOf:
      - maxLength: 128
        type: string
      - type: 'null'
      default: null
    nominal_thickness_nm:
      anyOf:
      - type: string
        x-db-type: decimal(12,3)
      - type: 'null'
      default: null
    size_desc:
      anyOf:
      - maxLength: 64
        type: string
      - type: 'null'
      default: null
    cut_position:
      anyOf:
      - maxLength: 128
        type: string
      - type: 'null'
      default: null
    surface_state:
      anyOf:
      - maxLength: 128
        type: string
      - type: 'null'
      default: null
    pre_treatment:
      anyOf:
      - maxLength: 255
        type: string
      - type: 'null'
      default: null
    status:
      $ref: '#/SampleStatus'
    exclude_from_analysis:
      type: boolean
      default: false
    exclude_reason:
      anyOf:
      - maxLength: 20000
        type: string
      - type: 'null'
      default: null
    notes:
      anyOf:
      - maxLength: 20000
        type: string
      - type: 'null'
      default: null
BatchSampleCreate:
  type: object
  additionalProperties: false
  description: 在一个批次下原子创建 1–50 个样品；sample_code 必填且全局唯一，重复或校验失败整批回滚。
  required:
  - items
  properties:
    request_key:
      type: [string, 'null']
      minLength: 16
      maxLength: 64
      description: 可选创建意图键；相同键与内容重试返回原样品，修改内容则冲突。
    parent_sample_id:
      anyOf:
      - exclusiveMinimum: 0
        type: integer
      - type: 'null'
      default: null
      description: 可选；必须属于该批次且为母片/整片。
    items:
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: '#/BatchItem'
BatchLinkCreate:
  type: object
  additionalProperties: false
  description: 一次绑定 1–50 个样品到同一执行；公共附加字段对每条相同。
  required:
  - sample_ids
  properties:
    sample_ids:
      type: array
      minItems: 1
      maxItems: 50
      items:
        exclusiveMinimum: 0
        type: integer
    chamber_position:
      anyOf:
      - maxLength: 64
        type: string
      - type: 'null'
      default: null
    o3_pre_cycles:
      anyOf:
      - maximum: 4294967295
        minimum: 0
        type: integer
      - type: 'null'
      default: null
    hf_tma_repeats:
      anyOf:
      - maximum: 4294967295
        minimum: 0
        type: integer
      - type: 'null'
      default: null
    full_ale_cycles:
      anyOf:
      - maximum: 4294967295
        minimum: 0
        type: integer
      - type: 'null'
      default: null
    is_control:
      type: boolean
      default: false
    sample_role_note:
      anyOf:
      - maxLength: 20000
        type: string
      - type: 'null'
      default: null
PlanArchive:
  type: object
  additionalProperties: false
  description: 计划归档请求；expected_row_version 可选，不匹配返回 409；已归档幂等返回当前详情。
  properties:
    expected_row_version:
      anyOf:
      - minimum: 1
        type: integer
      - type: 'null'
      default: null
RecordArchive:
  additionalProperties: false
  properties:
    expected_row_version:
      minimum: 1
      type: integer
      x-python-strict: true
  required:
  - expected_row_version
  type: object
SampleVoid:
  additionalProperties: false
  properties:
    expected_row_version:
      minimum: 1
      title: Expected Row Version
      type: integer
      x-python-strict: true
    reason:
      maxLength: 2000
      minLength: 1
      title: Reason
      type: string
  required:
  - expected_row_version
  - reason
  title: SampleVoid
  type: object
  x-python-methods: []
  x-nonblank-fields:
  - reason
  x-python-strip-whitespace: true
PlanGridDetail:
  allOf:
  - $ref: '#/components/schemas/ExperimentPlan'
  - type: object
    required:
    - steps
    - batch
    - processes
    - process_count
    - owner
    properties:
      steps:
        type: array
        items:
          $ref: '#/components/schemas/PlanStep'
      batch:
        anyOf:
        - $ref: '#/components/schemas/Batch'
        - type: 'null'
      processes:
        type: array
        items:
          $ref: '#/components/schemas/Process'
      process_count: &id003
        type: integer
        minimum: 0
        x-db-column: false
      owner:
        anyOf:
        - type: object
          additionalProperties: true
        - type: 'null'
ProcessGridDetail:
  allOf:
  - $ref: '#/components/schemas/Process'
  - type: object
    required:
    - steps
    - batch
    - samples
    - step_count
    - sample_count
    - plan
    - tool
    properties:
      steps:
        type: array
        items:
          $ref: '#/components/schemas/ProcessStep'
      batch:
        anyOf:
        - $ref: '#/components/schemas/Batch'
        - type: 'null'
      samples:
        type: array
        items:
          $ref: '#/components/schemas/ProcessSampleLink'
      step_count: *id003
      sample_count: *id003
      plan:
        anyOf:
        - $ref: '#/components/schemas/ExperimentPlan'
        - type: 'null'
      tool:
        anyOf:
        - $ref: '#/components/schemas/Tool'
        - type: 'null'

ParticipationEvent:
