SampleType:
  type: string
  enum:
  - parent_wafer
  - full_wafer
  - coupon
  description: '样品类型。

    - `parent_wafer` 母片（整片晶圆，切割前的原始片）

    - `full_wafer`   整片（未切割，用于整片测量，如 81 点 O3-only）

    - `coupon`       小样（从母片切下的小片）

    '
SampleStatus:
  type: string
  enum:
  - available
  - in_process
  - consumed
  - lost
  - quarantined
  description: 样品状态。
Sample:
  type: object
  description: '样品。**工作台的中心实体**。

    样品编码全局唯一（W01-S01 / B28-S06 / B05-S01 是不同样品，

    不因数字相同而合并）。


    阶段 1：admin 全部可见；operator/viewer 仅自己的 owner_user_id；样品所属批次也必须可见，无共享。'
  required:
  - sample_id
  - sample_code
  - batch_id
  - sample_type
  - status
  - exclude_from_analysis
  - created_at
  - row_version
  - voided_at
  - void_reason
  - voided_by_user_id
  - archived_at
  - archived_by_user_id
  properties:
    sample_id:
      type: integer
      format: int64
    sample_code:
      type: string
      maxLength: 64
      description: 全局唯一样品编码
      examples:
      - W01-S09
    batch_id:
      type: integer
      format: int64
    batch_code:
      type: string
      description: 所属批次编码（联表冗余，便于前端展示）
      examples:
      - B-20260831-W01
    parent_sample_id:
      type:
      - integer
      - 'null'
      format: int64
      description: 母片/上级样品 ID（支持母片-小样层级）
    sample_type:
      $ref: '#/SampleType'
    display_label:
      type:
      - string
      - 'null'
      maxLength: 128
      description: 原始文件中的编号，如 "1" / "9"
      examples:
      - '9'
    nominal_thickness_nm:
      type:
      - string
      - 'null'
      x-db-type: decimal(12,3)
    size_desc:
      type:
      - string
      - 'null'
      maxLength: 64
      examples:
      - 20mmx20mm
    cut_position:
      type:
      - string
      - 'null'
      maxLength: 128
    surface_state:
      type:
      - string
      - 'null'
      maxLength: 128
    pre_treatment:
      type:
      - string
      - 'null'
      maxLength: 255
      description: '前处理描述。ISS-05 要求必须记录前处理——

        W01-S09 因酒精湿巾擦拭导致结果异常。

        '
      examples:
      - 酒精湿巾擦拭后 HF-only
    status:
      $ref: '#/SampleStatus'
    exclude_from_analysis:
      type: boolean
      description: '是否排除出常规统计。

        **本字段在数据库层面固化异常样品隔离**——

        W01-S09 表观减薄约 9.84nm（正常约 1.127nm），

        严禁纳入常规 HF-only 速率均值（ISS-05）。

        '
      examples:
      - true
    exclude_reason:
      type:
      - string
      - 'null'
      description: 排除理由。`exclude_from_analysis=true` 时应填写。
      examples:
      - 'ISS-05: 酒精湿巾擦拭导致刻蚀量异常升高且均匀度破坏'
    owner_user_id:
      type:
      - integer
      - 'null'
      format: int64
    notes:
      type:
      - string
      - 'null'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    row_version:
      type: integer
      minimum: 1
      readOnly: true
      description: 服务端并发版本，每次更新递增。
    voided_at:
      anyOf:
      - *id001
      - type: 'null'
      readOnly: true
      x-db-column: samples.voided_at
    void_reason:
      anyOf:
      - type: string
        maxLength: 2000
      - type: 'null'
      readOnly: true
      x-db-column: samples.void_reason
    voided_by_user_id:
      anyOf:
      - *id002
      - type: 'null'
      readOnly: true
      x-db-column: samples.voided_by_user_id
    archived_at:
      anyOf:
      - *id001
      - type: 'null'
      readOnly: true
      x-db-column: samples.archived_at
    archived_by_user_id:
      anyOf:
      - *id002
      - type: 'null'
      readOnly: true
      x-db-column: samples.archived_by_user_id
