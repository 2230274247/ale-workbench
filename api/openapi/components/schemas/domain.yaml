    cumulative_cycles: {type: [integer, 'null']}
    measured_at: {type: [string, 'null'], format: date-time}
    thickness_mean_nm: {type: [string, 'null']}
    thickness_sd_nm: {type: [string, 'null']}
    thickness_min_nm: {type: [string, 'null']}
    thickness_max_nm: {type: [string, 'null']}
    mse_mean: {type: [string, 'null']}
    quality_flag: {type: string}
    is_current: {type: boolean}
    process_id: {type: [integer, 'null'], format: int64}
ParticipationSummary:
  type: object
