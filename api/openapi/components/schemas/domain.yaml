BatchStatus:
  type: string
  enum:
  - active
  - archived
  - quarantined
  description: '批次状态。

    - `active`      正常使用

    - `archived`    已归档

    - `quarantined` 已隔离（如 PECVD 温度异常批次）

    '
Batch:
  type: object
  description: '沉积批次。**批次是数据可比性的强制隔离边界**——

    不同批次初始厚度约 30/300/74/47nm，不应合并拟合。


    阶段 1：admin 全部可见；operator/viewer 仅自己的 owner_user_id；样品所属批次也必须可见，无共享。'
  required:
  - batch_id
  - batch_code
  - batch_name
  - material
  - anomaly_flag
  - status
  - created_at
  - row_version
  - voided_at
  - void_reason
  - voided_by_user_id
  properties:
    batch_id:
      type: integer
      format: int64
      examples:
      - 1
    batch_code:
      type: string
      maxLength: 64
      description: 批次编码，全局唯一
      examples:
      - B-20260831-W01
    batch_name:
      type: string
      maxLength: 255
      examples:
      - 8/31 批次 约30nm W01
    material:
      type: string
      maxLength: 128
      examples:
      - PECVD SiNx:H
    wafer_size:
      type:
      - string
      - 'null'
      maxLength: 32
      examples:
      - 4inchx4inch
    nominal_thickness_nm:
      type:
      - string
      - 'null'
      x-db-type: decimal(12,3)
      description: 标称厚度（nm）。为 string 以避免浮点精度损失。
      examples:
      - '30.000'
    deposit_recipe_id:
      type:
      - integer
      - 'null'
      format: int64
    deposit_date:
      type:
      - string
      - 'null'
      format: date
    deposit_set_temp_c:
      type:
      - string
      - 'null'
      x-db-type: decimal(8,2)
      description: PECVD 设定温度（℃）
      examples:
      - '275.00'
    deposit_actual_temp_c:
      type:
      - string
      - 'null'
      x-db-type: decimal(8,2)
      description: 'PECVD 实测温度（℃）。**必须与设定值分开记录**——

        ISS-02 要求不可据文件名断言温度异常幅度。

        '
      examples:
      - '275.00'
    deposit_gas_flows:
      type:
      - object
      - 'null'
      additionalProperties: true
      description: '沉积气体流量，如 {"SiH4": 20, "NH3": 100, "N2": 200}'
    source_zip:
      type:
      - string
      - 'null'
      maxLength: 255
      examples:
      - 1.-2026.8.31-SiN.zip
    source_zip_sha256:
      type:
      - string
      - 'null'
      pattern: ^[a-f0-9]{64}$
      description: 原始压缩包 SHA-256，用于溯源校验
      examples:
      - 93e9e8593de2ccc83ac75ab7058f313d16b1b84bdd3471c6101310bfb185b99a
    anomaly_flag:
      type: boolean
      description: 是否为已知异常批次
      examples:
      - false
    anomaly_note:
      type:
      - string
      - 'null'
      description: 异常描述。**禁止据文件名断言故障机理**（ISS-02）。
    owner_user_id:
      type:
      - integer
      - 'null'
      format: int64
    status:
      $ref: '#/BatchStatus'
    notes:
      type:
      - string
      - 'null'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    row_version:
      type: integer
      minimum: 1
      readOnly: true
      description: 服务端并发版本，每次更新递增。
    archived_at:
      type:
      - string
      - 'null'
      format: date-time
      readOnly: true
      x-db-column: batches.archived_at
      description: 独立归档时间；null 表示未归档，不改原有科学状态。
    voided_at:
      anyOf:
      - &id001
        type: string
        format: date-time
      - type: 'null'
      readOnly: true
      x-db-column: batches.voided_at
    void_reason:
      anyOf:
      - type: string
        maxLength: 2000
      - type: 'null'
      readOnly: true
      x-db-column: batches.void_reason
    voided_by_user_id:
      anyOf:
      - &id002
        type: integer
        exclusiveMinimum: 0
      - type: 'null'
      readOnly: true
      x-db-column: batches.voided_by_user_id
BatchCreate:
  type: object
  required:
  - batch_code
  - batch_name
  properties:
    batch_code:
      type: string
      maxLength: 64
    batch_name:
      type: string
      maxLength: 255
    material:
      type: string
      maxLength: 128
      default: PECVD SiNx:H
    wafer_size:
      type: string
      maxLength: 32
    nominal_thickness_nm:
      type: string
      x-db-type: decimal(12,3)
    deposit_recipe_id:
      type: integer
      format: int64
    deposit_date:
      type: string
      format: date
    deposit_set_temp_c:
      type: string
      x-db-type: decimal(8,2)
    deposit_actual_temp_c:
      type: string
      x-db-type: decimal(8,2)
    deposit_gas_flows:
      type: object
      additionalProperties: true
    source_zip:
      type: string
    source_zip_sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    anomaly_flag:
      type: boolean
      default: false
    anomaly_note:
      type: string
    status:
      $ref: '#/BatchStatus'
    notes:
      type: string
