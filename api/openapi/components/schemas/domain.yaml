    r2_temp_c: {type: [string, 'null']}
    n2_flow_sccm: {type: [string, 'null']}
    voided_at: {type: [string, 'null'], format: date-time}
    process_mode: {type: string}
    log_status: {type: string}
    started_at: {type: [string, 'null'], format: date-time}
    ended_at: {type: [string, 'null'], format: date-time}
    plan_id: {type: [integer, 'null'], format: int64}
    plan_code: {type: [string, 'null']}
    plan_title: {type: [string, 'null']}
    batch_id: {type: [integer, 'null'], format: int64}
    chamber_position: {type: [string, 'null']}
    o3_pre_cycles: {type: [integer, 'null']}
    hf_tma_repeats: {type: [integer, 'null']}
    full_ale_cycles: {type: [integer, 'null']}
    cycles_recorded: {type: boolean}
    cycles_confirmed: {type: boolean}
