            $ref: ../openapi.yaml#/components/schemas/PlanUpdate
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                required:
                - data
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/ExperimentPlanDetail
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
