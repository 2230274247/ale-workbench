/api/v1/plans:
  get:
    tags:
    - 实验计划
    summary: 实验计划列表
    operationId: listPlans
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/SizeParam
    - $ref: ../openapi.yaml#/components/parameters/SortParam
    - $ref: ../openapi.yaml#/components/parameters/KeywordParam
    - name: status
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/PlanStatus
    - name: priority
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/PlanPriority
    - name: batch_id
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: owner_user_id
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: include_voided
      in: query
      required: false
      schema:
        type: boolean
        default: false
        title: Include Voided
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/ExperimentPlan
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
    x-implementation-status: implemented
    description: 登录用户可读。admin 全部可见；operator/viewer 仅自己的计划（owner_user_id）或运行（operator_user_id），且关联批次、计划、全部参与样品均须可见；越权资源返回 404。
      默认 -created_at，keyword 搜索 plan_code/title。排序白名单：plan_id, plan_code, title, status, priority, planned_start, planned_end,
      created_at, updated_at；逗号分隔，- 表示降序。
  post:
    tags:
    - 实验计划
    summary: 创建实验计划
    operationId: createPlan
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/PlanCreate
    responses:
      '201':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                required:
                - data
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/ExperimentPlanDetail
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
    x-implementation-status: implemented
    description: admin/operator 可写，viewer 返回 403；应用相同所有权与关联可见性检查，越权资源返回 404。 服务端确定 owner_user_id；planned_end 不得早于 planned_start。
