        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
    x-implementation-status: implemented
    description: admin/operator 可写，viewer 返回 403；应用相同所有权与关联可见性检查，越权资源返回 404。 expected_row_version 可选，匹配计划版本；已有运行的批次必须保留匹配，否则
      409。
  delete:
    tags:
    - 实验计划
    summary: 删除实验计划
    description: admin/operator 可写，viewer 返回 403；应用相同所有权与关联可见性检查，越权资源返回 404。 存在计划步骤、关联运行或其他科学依赖返回 409；不置空关联、不级联删除。
    operationId: deletePlan
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdPathParam
    - name: expected_row_version
      in: query
      required: false
      description: 可选；匹配父计划/运行 row_version，否则 409。子记录删除比较父版本。
      schema:
        type:
        - integer
        - 'null'
        minimum: 1
    responses:
      '204':
        description: 已删除
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
    x-implementation-status: implemented
