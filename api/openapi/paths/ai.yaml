/api/v1/ai/chat:
  post:
    tags:
    - AI助手
    summary: chatAI
    operationId: chatAI
    x-implementation-status: implemented
    description: 所有登录角色。AI工具每次重新检查当前权限与数据，排除作废样品。HTTP200内检查data.status/error；provider失败不转换为HTTP502。 request_id(UUID)幂等：同ID不同输入409、他人ID404；已结算原ID查询不外发、不重复计费；重新核验当前session、配置revision及全部证据，一致则返回原答案/来源/trace并replayed=true，否则status=failed、隐藏答案/来源/trace并给出authorization_changed、configuration_changed或evidence_unavailable。旧版本无证据请求保守隐藏。conversation_id仅本人且须存在，忙会话409；省略创建新会话。消息非空白1..4000字符；context
      kind=none须id=null，其余须严格正整数。服务端仅参考最近两轮成功请求的用户意图（每轮最多1000字符），最多重新执行四个去重白名单工具计划；使用当前账户范围获取新数据，支持省略ID的追问。客户端不能提交历史，旧模型回答不发送模型。
    responses:
      '200':
        description: 成功；实际响应使用统一包络
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                required:
                - data
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/AITurnResult
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
      '503':
        $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/AIChatRequest
