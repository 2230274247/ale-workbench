/api/v1/batches:
  get:
    tags:
    - 批次
    summary: 批次列表
    description: '批次是数据可比性的强制隔离边界。

      默认按 deposit_date 降序。

      admin 可访问全部；operator/viewer 仅自己的批次与样品，样品所属批次也须可见；无共享。'
    operationId: listBatches
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/SizeParam
    - $ref: ../openapi.yaml#/components/parameters/SortParam
    - $ref: ../openapi.yaml#/components/parameters/KeywordParam
    - name: status
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/BatchStatus
    - name: anomaly_flag
      in: query
      description: 筛选异常批次
      schema:
        type: boolean
    - name: material
      in: query
      schema:
        type: string
    - name: include_voided
      in: query
      required: false
      schema:
        type: boolean
        default: false
        title: Include Voided
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/Batch
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
    x-implementation-status: implemented
  post:
    tags:
    - 批次
    summary: 创建批次
    description: '需要 `batch:write` 权限。

      admin 可访问全部；operator/viewer 仅自己的批次与样品，样品所属批次也须可见；无共享。'
    operationId: createBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/BatchCreate
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/Batch
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
    x-implementation-status: implemented
