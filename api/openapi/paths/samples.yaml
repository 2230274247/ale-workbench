/api/v1/samples/{id}/transitions:
  get:
    tags:
    - 样品流转
    summary: 样品流转时间线
    description: 登录后按样品可见范围查询；admin 全部，operator/viewer 仅自己且批次可见的样品。按 transition_id 升序分页（追加序），不按 event_at；event_at 可为 null
      或补录过去时间。 响应必含 context_redacted 布尔值；关联运行不可见时为 true，process_id/step_id/operator_user_id/location/note/measurement_id 均返回
      null，状态轨迹仍保留。
    operationId: listSampleTransitions
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdPathParam
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/SizeParam
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/SampleTransition
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
    x-implementation-status: implemented
  post:
    tags:
    - 样品流转
    summary: 记录样品流转
    description: admin/operator 可写，viewer 返回 403；应用相同所有权与关联可见性检查，越权资源返回 404。 expected_row_version 必填并匹配样品版本，否则 409。原子更新样品状态、递增样品
      row_version 并追加历史（含审计）；历史无修改/删除接口。step_id 表示实际步骤完成之后，须属于给定 process_id；提供运行必须已绑定该样品，measurement_id 必须属于该样品（不符 422）。load：需
      process_id，available → in_process 且无活动占用；unload：需同一活动运行，in_process → available/quarantined/consumed；装载和取出均指定 step_id
      时取出 step_index 不得小于装载。占用根据最新 load/unload 的 transition_id 判断，跨运行重复装载返回 409。仅 load 可进入 in_process，离开必须 unload。receive/quarantine/dispose
      分别要求 available/quarantined/consumed或lost（不符 422）；cut/measure/process 保持原状态。in_process 中其他事件必须提供活动运行，否则 409。
    operationId: createSampleTransition
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdPathParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/TransitionCreate
    responses:
      '201':
        description: 已记录
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/SampleTransition
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
    x-implementation-status: implemented
