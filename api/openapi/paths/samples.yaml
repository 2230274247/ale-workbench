/api/v1/samples/{id}/void:
  post:
    tags:
    - 样品
    summary: 作废误建且未使用的样品
    operationId: voidSample
    x-implementation-status: implemented
    description: writer（admin/operator）且样品可见。必填最新expected_row_version及去首尾空白的1..2000字符reason。只允许available、唯一无实际信息的初始receive、样品与流转均有创建审计、无任何科研/子样品/来源/多态关联的样品。保护或版本冲突409；作废不更改status/科学字段，不删除数据；禁止再编辑或新增关联。已作废时携带最新版本和相同原因返回当前记录，不再次递增；旧版本或不同原因409。
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdPathParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/SampleVoid
    responses:
      '200':
        description: 成功；实际响应使用统一包络
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                required:
