/api/v1/findings:
  get:
    tags:
    - 结论台账
    summary: 研究结论列表
    description: '`evidence_level` 字段强制区分实测观察与机理假设。

      可用 `evidence_level=hypothesis` 筛出尚未证实的结论。

      '
    operationId: listFindings
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/SizeParam
    - $ref: ../openapi.yaml#/components/parameters/SortParam
    - $ref: ../openapi.yaml#/components/parameters/KeywordParam
    - name: evidence_level
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/EvidenceLevel
    - name: is_confirmed
      in: query
      schema:
        type: boolean
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/Finding
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
    x-implementation-status: planned
  post:
    tags:
    - 结论台账
    summary: 创建结论
    operationId: createFinding
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/FindingCreate
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
