/api/v1/source-files/{id}/content:
  get:
    operationId: downloadSourceFile
    tags:
    - 原始文件
    summary: 下载原始文件
    description: 授权后读取不可变存储并验证 SHA；原件不存在404，完整性失败409。成功直接返回二进制，无 JSON 包络。
    x-implementation-status: implemented
    parameters:
    - *id003
    responses:
      '200':
        description: 原始字节
        headers:
          Content-Disposition:
            schema:
              type: string
            description: attachment; filename*=UTF-8 编码安全文件名
          X-Content-Type-Options:
            schema:
              type: string
            description: nosniff
          Cache-Control:
            schema:
              type: string
            description: private, no-store；全局 middleware 最终设置 no-store
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
