        application/json:
          schema:
            type: object
            properties:
              result_ids:
                type: array
                description: 指定要重算的结果 ID；为空则重算全部 is_valid=false 的结果
                items:
                  type: integer
                  format: int64
              sample_ids:
                type: array
                items:
                  type: integer
                  format: int64
              process_ids:
                type: array
                items:
                  type: integer
                  format: int64
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      recomputed_count:
                        type: integer
                      results:
                        type: array
                        items:
