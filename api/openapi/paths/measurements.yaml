/api/v1/measurements/{id}/supersede:
  post:
    operationId: supersedeMeasurement
    tags:
    - 测量
    summary: supersedeMeasurement
    description: admin/operator；必须指定替代测量及双方当前版本和非空原因。两者同样品、均 current；替代测量不能已有前驱；拒绝分叉/循环/重复取代。旧行 is_current=false 并保存 reason，新行
      supersedes_measurement_id 指旧行；双方版本递增，依赖双方的派生结果失效。返回旧测量详情加 replacement，不返回失效ID列表。
    x-implementation-status: implemented
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/MeasurementSupersedeResult
                required:
                - data
    parameters:
    - *id003
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/MeasurementSupersedeRequest
