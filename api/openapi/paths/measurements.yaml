            properties:
              files:
                type: array
                items:
                  type: object
                  required:
                  - file_sha256
                  properties:
                    file_sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                    file_name:
                      type: string
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      matched:
                        type: integer
                      unknown:
                        type: array
                        items:
