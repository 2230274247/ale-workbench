    summary: 校验文件指纹
    description: '按 SHA-256 校验原始文件是否被改动。

      传入文件名与期望哈希，服务端比对登记记录。

      '
    operationId: verifySourceFiles
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
