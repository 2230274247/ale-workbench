/api/v1/optical-models:
  get:
    tags:
    - 光学模型
    summary: 光学模型列表
    description: '椭偏 n/k 模型列表。由于 n/k 编码在原始文件名而非内容中，

      且同一样品前后测量可能用不同模型，本资源是结论可信度的关键。

      '
    operationId: listOpticalModels
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/SizeParam
    - $ref: ../openapi.yaml#/components/parameters/KeywordParam
    - name: status
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/OpticalModelStatus
    - name: applicable_batch_id
      in: query
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/OpticalModel
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
    x-implementation-status: planned
  post:
    tags:
    - 光学模型
    summary: 创建光学模型
    operationId: createOpticalModel
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/OpticalModel
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/OpticalModel
