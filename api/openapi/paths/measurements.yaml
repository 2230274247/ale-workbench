    description: 真实来源按当前用户权限加载；最多20组/20000测点；十进制字符串，50位ROUND_HALF_EVEN；不插值、不推断关联或机理。必须confirm_pair=true、不同测量、同样品/光学模型，真实XY唯一精确匹配；无匹配/未知或不一致模型返回422。include_points=false省略points。
