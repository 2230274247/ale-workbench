/api/v1/derived-results:
  get:
    tags:
    - 数据分析
    summary: 派生结果列表
    description: '默认仅返回有效结果（is_valid=true）。

      可通过 model_consistent=false 筛选出**跨模型相减**的结果，

      这类结果的解释需格外谨慎。

      '
    operationId: listDerivedResults
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/SizeParam
    - $ref: ../openapi.yaml#/components/parameters/SortParam
    - name: sample_id
      in: query
      schema:
        type: integer
        format: int64
    - name: process_id
      in: query
      schema:
        type: integer
        format: int64
    - name: result_kind
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/ResultKind
    - name: evidence_level
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/EvidenceLevel
    - name: model_consistent
      in: query
      description: 筛选跨模型相减（false）或同模型（true）的结果
      schema:
        type: boolean
    - name: is_valid
      in: query
      schema:
        type: boolean
        default: true
    - name: batch_code
      in: query
      schema:
        type: string
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/DerivedResult
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
    x-implementation-status: planned
  post:
    tags:
    - 数据分析
    summary: 创建派生结果
    description: '服务端会自动判定 model_consistent（比较前后测量的

      optical_model_id 是否相同），不接受客户端指定。

