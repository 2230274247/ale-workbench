/api/v1/measurements:
  get:
    operationId: listMeasurements
    tags:
    - 测量
    summary: listMeasurements
    description: 默认包含当前与历史测量；current/is_current 与 quality/quality_flag 是别名，同时给出则叠加过滤。样品范围授权。sort 仅支持后端白名单。
    x-implementation-status: implemented
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/Measurement
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
                required:
                - data
                - meta
    parameters:
    - &id004
      $ref: ../openapi.yaml#/components/parameters/PageParam
    - &id005
      $ref: ../openapi.yaml#/components/parameters/SizeParam
    - name: sort
      in: query
      required: false
      schema:
        type: string
    - name: sample_id
      in: query
      required: false
      schema: &id001
        type: integer
        exclusiveMinimum: 0
    - name: process_id
      in: query
      required: false
      schema: *id001
    - name: stage
      in: query
      required: false
      schema:
        $ref: ../openapi.yaml#/components/schemas/MeasurementStage
    - name: current
      in: query
      required: false
      schema: &id002
        type: boolean
    - name: is_current
      in: query
      required: false
      schema: *id002
    - name: quality
      in: query
      required: false
      schema:
        $ref: ../openapi.yaml#/components/schemas/MeasurementQualityFlag
    - name: quality_flag
      in: query
      required: false
      schema:
        $ref: ../openapi.yaml#/components/schemas/MeasurementQualityFlag
  post:
    tags:
    - 测量
    summary: 创建测量
    description: '可随测量一并提交点级数据（points 字段）。

      服务端会根据点级数据自动计算 thickness_mean_nm 等统计量

      （若请求中未显式提供）。

      '
    operationId: createMeasurement
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/MeasurementCreate
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/MeasurementDetail
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
    x-implementation-status: planned
