/api/v1/chemistry-systems:
  get:
    tags:
    - 化学体系
    summary: 化学体系列表
    description: 登录用户可读。admin 全部可见；operator/viewer 仅自己拥有的体系（owner_user_id），无主体系仅 admin 可见；越权资源返回 404。默认 -created_at，keyword 搜索 system_code/system_name。排序白名单：system_id, system_code, system_name, status, created_at, updated_at。
    operationId: listChemistrySystems
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/PageParam
    - $ref: ../openapi.yaml#/components/parameters/SizeParam
    - $ref: ../openapi.yaml#/components/parameters/SortParam
    - $ref: ../openapi.yaml#/components/parameters/KeywordParam
    - name: status
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/SystemStatus
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../openapi.yaml#/components/schemas/ChemistrySystem
                  meta:
                    $ref: ../openapi.yaml#/components/schemas/PageMeta
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
    x-implementation-status: implemented
  post:
    tags:
    - 化学体系
    summary: 创建化学体系
    description: admin/operator 可写，viewer 返回 403。owner_user_id 由服务端确定；system_code 全局唯一，重复返回 409。
    operationId: createChemistrySystem
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ChemistrySystemCreate
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                required:
                - data
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/ChemistrySystem
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
    x-implementation-status: implemented
/api/v1/chemistry-systems/{id}:
  get:
    tags:
    - 化学体系
    summary: 化学体系详情
    description: 登录用户可读，越权资源返回 404。响应内嵌 species[]、templates[] 与 owner。
    operationId: getChemistrySystem
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdPathParam
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/ChemistrySystem
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
    x-implementation-status: implemented
  patch:
    tags:
    - 化学体系
    summary: 更新化学体系
    description: admin/operator 可写，viewer 返回 403；越权资源返回 404。expected_row_version 可选，非 null 时匹配体系 row_version，否则 409。
    operationId: updateChemistrySystem
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdPathParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ChemistrySystemUpdate
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../openapi.yaml#/components/schemas/ApiEnvelope
              - type: object
                properties:
                  data:
                    $ref: ../openapi.yaml#/components/schemas/ChemistrySystem
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/UnprocessableEntity
    x-implementation-status: implemented
  delete:
    tags:
    - 化学体系
    summary: 删除化学体系
    description: 仅管理员可删除；越权资源返回 404。被执行（processes.chemistry_system_id）引用时返回 409，不级联删除。
    operationId: deleteChemistrySystem
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdPathParam
    responses:
      '204':
        description: 已删除
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
    x-implementation-status: implemented
