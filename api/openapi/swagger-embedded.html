lumn": false}}, "title": "Selection", "type": "object", "x-python-strict": true, "x-python-strip-whitespace": false, "x-python-definition": "class AnalysisSelection(ApiBaseModel):\n    model_config = ConfigDict(extra='forbid', strict=True, str_strip_whitespace=False)\n    include_outliers: bool = True\n    excluded_points: list[Annotated[str, Field(min_length=1,max_length=80)]] = Field(default_factory=list,max_length=1000)\n    reason: Annotated[str, Field(max_length=4000)] = ''\n    @model_validator(mode='after')\n    def reason_for_exclusion(self):\n        if (not self.include_outliers or self.excluded_points) and not self.reason.strip():\n            raise ValueError('Exclusion requires an auditable reason')\n        if len(set(self.excluded_points)) != len(self.excluded_points):\n            raise ValueError('Duplicate exclusions')\n        return self"}, "AnalysisCalculate": {"additionalProperties": false, "properties": {"after_index": {"anyOf": [{"maximum": 19, "minimum": 0, "type": "integer"}, {"type": "null"}], "default": null, "title": "After Index", "x-db-column": false}, "before_index": {"anyOf": [{"maximum": 19, "minimum": 0, "type": "integer"}, {"type": "null"}], "default": null, "title": "Before Index", "x-db-column": false}, "confirm_pair": {"default": false, "title": "Confirm Pair", "type": "boolean", "x-db-column": false}, "selection": {"$ref": "#/components/schemas/AnalysisSelection", "x-db-column": false}, "sources": {"items": {"$ref": "#/components/schemas/AnalysisSource"}, "maxItems": 20, "minItems": 1, "title": "Sources", "type": "array", "x-db-column": false}}, "required": ["sources"], "title": "Calculate", "type": "object", "x-python-strict": true, "x-python-strip-whitespace": false, "x-python-definition": "class AnalysisCalculate(ApiBaseModel):\n    model_config = ConfigDict(extra='forbid', strict=True, str_strip_whitespace=False)\n    sources: list[AnalysisSource] = Field(min_length=1,max_length=20)\n    selection: AnalysisSelection = Fiel
